<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Laporan — SO Perlengkapan</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="loading" style="display:none"><div class="spinner"></div><p>Memuat...</p></div>
<nav class="navbar" id="navbar"></nav>
<div class="container">
  <div class="card">
    <div class="card-title">📄 Cetak Laporan</div>
    <div class="lap-mode-tabs">
      <button class="lap-mode-btn active" onclick="setMode('minggu')" id="mode-minggu">📆 Per Minggu</button>
      <button class="lap-mode-btn" onclick="setMode('custom')" id="mode-custom">🗓️ Custom</button>
    </div>

    <!-- Per Minggu -->
    <div id="filter-minggu">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <div class="fr"><label>Bulan</label>
          <select id="mgg-bln">
            ${['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'].map((b,i)=>`<option value="${i}" ${i===new Date().getMonth()?'selected':''}>${b}</option>`).join('')}
          </select>
        </div>
        <div class="fr"><label>Tahun</label>
          <select id="mgg-thn"><option>2025</option><option selected>2026</option><option>2027</option></select>
        </div>
        <div class="fr"><label>Minggu ke-</label>
          <select id="mgg-ke">
            <option value="1">Minggu 1 (1–7)</option><option value="2">Minggu 2 (8–14)</option>
            <option value="3">Minggu 3 (15–21)</option><option value="4">Minggu 4 (22–28)</option>
            <option value="5">Minggu 5 (29–31)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Custom -->
    <div id="filter-custom" style="display:none">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="fr"><label>Tanggal Mulai</label><input type="date" id="dari"/></div>
        <div class="fr"><label>Tanggal Selesai</label><input type="date" id="sampai"/></div>
      </div>
    </div>

    <p style="font-size:12px;color:var(--tx2);margin-bottom:14px">Laporan mencakup barang keluar, barang masuk, dan transaksi cabang.</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" style="flex:1" onclick="preview()">👁️ Preview</button>
      <button class="btn btn-primary" style="flex:2" onclick="cetakPDF()">🖨️ Cetak / Simpan PDF</button>
    </div>
  </div>

  <div id="lap-preview" style="display:none">
    <div class="section-label">Preview Laporan</div>
    <div class="card" id="prev-keluar"></div>
    <div class="card" id="prev-masuk"></div>
    <div class="card" id="prev-cabang"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
if(!requireLogin()) throw '';
renderNavbar('laporan.html');
const user=getUser();
let logData=[], restockData=[], logCabangData=[], mode='minggu';

function setMode(m){
  mode=m;
  ['minggu','custom'].forEach(x=>{
    document.getElementById(`filter-${x}`).style.display=x===m?'block':'none';
    document.getElementById(`mode-${x}`).classList.toggle('active',x===m);
  });
  document.getElementById('lap-preview').style.display='none';
}

function getRange(){
  if(mode==='minggu'){
    const m=parseInt(document.getElementById('mgg-bln').value);
    const y=parseInt(document.getElementById('mgg-thn').value);
    const k=parseInt(document.getElementById('mgg-ke').value);
    const start=((k-1)*7)+1, end=Math.min(k*7,new Date(y,m+1,0).getDate());
    const dS=`${y}-${String(m+1).padStart(2,'0')}-${String(start).padStart(2,'0')}`;
    const dE=`${y}-${String(m+1).padStart(2,'0')}-${String(end).padStart(2,'0')}`;
    return{dS,dE,label:`Minggu ${k} ${BLN_FULL[m]} ${y} (${start}–${end} ${BLN_FULL[m]} ${y})`};
  }
  const dS=document.getElementById('dari').value;
  const dE=document.getElementById('sampai').value;
  if(!dS||!dE) return null;
  return{dS,dE,label:`${fmtDate(dS)} s/d ${fmtDate(dE)}`};
}

function filterByRange(data, range){
  return data.filter(l=>{const t=(l.tanggal||'').substring(0,10);return t>=range.dS&&t<=range.dE;});
}

function itemsToQty(items){ const m={}; (items||[]).forEach(x=>{m[x.nama]=(m[x.nama]||0)+Number(x.jumlah);}); return m; }

function rekap(logs){
  const map={};
  logs.forEach(l=>(l.items||[]).forEach(x=>{map[x.nama]=(map[x.nama]||0)+Number(x.jumlah);}));
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function preview(){
  const range=getRange();
  if(!range){showToast('Lengkapi periode dulu!','error');return;}
  document.getElementById('lap-preview').style.display='block';

  const keluar=filterByRange(logData,range);
  const masuk=filterByRange(restockData,range);
  const cabang=filterByRange(logCabangData,range);

  const rekapKeluar=rekap(keluar);
  const totK=rekapKeluar.reduce((s,[,v])=>s+v,0);
  document.getElementById('prev-keluar').innerHTML=`
    <div class="card-title">📤 Barang Keluar</div>
    ${rekapKeluar.length
      ?rekapKeluar.map(([n,q])=>`<div class="rekap-row"><span>${n}</span><span><strong>${q} pcs</strong></span></div>`).join('')+
        `<div class="rekap-row" style="font-weight:700;border-top:1.5px solid var(--border2);margin-top:4px;padding-top:8px"><span>Total</span><span>${totK} pcs</span></div>`
      :'<div style="font-size:13px;color:var(--tx2)">Tidak ada barang keluar.</div>'}`;

  // Group masuk
  const masukGroups={};
  masuk.forEach(r=>{const k=`${r.tanggal}||${r.keterangan}`;if(!masukGroups[k])masukGroups[k]={tanggal:r.tanggal,keterangan:r.keterangan,items:[]};masukGroups[k].items.push({nama:r.nama_barang,jumlah:r.jumlah});});
  document.getElementById('prev-masuk').innerHTML=`
    <div class="card-title">📥 Barang Masuk (Restock)</div>
    ${Object.values(masukGroups).length
      ?Object.values(masukGroups).map(g=>`<div style="padding:8px 0;border-bottom:0.5px solid var(--border)">
          <div style="font-size:12px;font-weight:600">${fmtDate(g.tanggal)} · ${g.keterangan}</div>
          <div style="font-size:12px;color:var(--tx2);margin-top:3px">${g.items.map(x=>`+${x.jumlah} ${x.nama}`).join(', ')}</div>
        </div>`).join('')
      :'<div style="font-size:13px;color:var(--tx2)">Tidak ada restock.</div>'}`;

  document.getElementById('prev-cabang').innerHTML=`
    <div class="card-title">🏪 Transaksi Cabang</div>
    ${cabang.length
      ?cabang.map(l=>`<div style="padding:8px 0;border-bottom:0.5px solid var(--border)">
          <div style="font-size:12px;font-weight:600">${fmtDate(l.tanggal)} · ${l.nama_cabang} · <span style="color:${l.tipe==='kirim'?'#854f0b':'#1B6B45'}">${l.tipe==='kirim'?'Kirim':'Kembali'}</span></div>
          <div style="font-size:12px;color:var(--tx2);margin-top:3px">${(l.items||[]).map(x=>`${l.tipe==='kirim'?'-':'+'}${x.jumlah} ${x.nama}`).join(', ')}</div>
        </div>`).join('')
      :'<div style="font-size:13px;color:var(--tx2)">Tidak ada transaksi cabang.</div>'}`;
}

function cetakPDF(){
  const range=getRange();
  if(!range){showToast('Lengkapi periode dulu!','error');return;}
  const keluar=filterByRange(logData,range);
  const masuk=filterByRange(restockData,range);
  const cabang=filterByRange(logCabangData,range);
  const rekapK=rekap(keluar);
  const totK=rekapK.reduce((s,[,v])=>s+v,0);
  const tgl=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const masukGroups={};
  masuk.forEach(r=>{const k=`${r.tanggal}||${r.keterangan}`;if(!masukGroups[k])masukGroups[k]={tanggal:r.tanggal,keterangan:r.keterangan,items:[]};masukGroups[k].items.push({nama:r.nama_barang,jumlah:r.jumlah});});

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Laporan SO</title>
<style>body{font-family:Arial,sans-serif;font-size:12px;margin:0}.page{padding:28px 36px;max-width:740px;margin:0 auto}
.hdr{background:#1B6B45;color:#fff;padding:16px 20px;border-radius:8px;margin-bottom:16px}
.hdr h1{font-size:17px;font-weight:700;margin:0 0 4px}.hdr p{font-size:11px;opacity:.85;margin:2px 0}
h2{font-size:13px;font-weight:700;margin:16px 0 8px;padding:6px 10px;background:#EAF5EE;color:#1B6B45;border-radius:6px;border-left:4px solid #1B6B45}
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
th{background:#EAF5EE;color:#1B6B45;padding:7px 9px;text-align:left;font-weight:700;border:1px solid #A8D5B8}
td{padding:7px 9px;border:1px solid #ddd;vertical-align:top}tr:nth-child(even) td{background:#fafafa}
.tot{font-weight:700;background:#EAF5EE;color:#1B6B45}
.foot{margin-top:20px;font-size:10px;color:#aaa;border-top:1px solid #ddd;padding-top:8px;display:flex;justify-content:space-between}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="page">
<div class="hdr"><h1>📄 Laporan SO Perlengkapan Umroh</h1><p>${range.label}</p><p>Dicetak: ${tgl} · Oleh: ${user.username}</p></div>

<h2>A. Rekapitulasi Barang Keluar</h2>
${rekapK.length?`<table><thead><tr><th>No</th><th>Nama Barang</th><th>Jumlah Keluar</th></tr></thead><tbody>
${rekapK.map(([n,q],i)=>`<tr><td>${i+1}</td><td>${n}</td><td><strong>${q} pcs</strong></td></tr>`).join('')}
<tr class="tot"><td colspan="2" style="text-align:right">Total</td><td><strong>${totK} pcs</strong></td></tr>
</tbody></table>`:'<p style="color:#888;font-size:11px">Tidak ada barang keluar pada periode ini.</p>'}

<h2>B. Detail Barang Keluar</h2>
${keluar.length?`<table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Barang</th><th>Petugas</th></tr></thead><tbody>
${keluar.map(l=>{const map=itemsToQty(l.items||[]);const s=Object.entries(map).map(([n,q])=>`${n} ×${q}`).join(', ');return`<tr><td>${fmtDate(l.tanggal)}</td><td>${l.keterangan||'—'}</td><td>${s}</td><td>${l.petugas||''}</td></tr>`;}).join('')}
</tbody></table>`:'<p style="color:#888;font-size:11px">Tidak ada.</p>'}

<h2>C. Barang Masuk (Restock)</h2>
${Object.values(masukGroups).length?`<table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Barang</th></tr></thead><tbody>
${Object.values(masukGroups).map(g=>`<tr><td>${fmtDate(g.tanggal)}</td><td>${g.keterangan}</td><td>${g.items.map(x=>`+${x.jumlah} ${x.nama}`).join(', ')}</td></tr>`).join('')}
</tbody></table>`:'<p style="color:#888;font-size:11px">Tidak ada restock.</p>'}

<h2>D. Transaksi Cabang / Agen</h2>
${cabang.length?`<table><thead><tr><th>Tanggal</th><th>Cabang</th><th>Tipe</th><th>Barang</th><th>Petugas</th></tr></thead><tbody>
${cabang.map(l=>{const s=(l.items||[]).map(x=>`${l.tipe==='kirim'?'-':'+'}${x.jumlah} ${x.nama}`).join(', ');return`<tr><td>${fmtDate(l.tanggal)}</td><td>${l.nama_cabang||''}</td><td>${l.tipe==='kirim'?'Kirim':'Kembali'}</td><td>${s}</td><td>${l.petugas||''}</td></tr>`;}).join('')}
</tbody></table>`:'<p style="color:#888;font-size:11px">Tidak ada transaksi cabang.</p>'}

<div class="foot"><span>SO Perlengkapan Umroh · Assyifa Tour & Travel</span><span>${tgl}</span></div>
</div></body></html>`;
  const w=window.open('','_blank','width=820,height=680');
  if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);}
  else showToast('Izinkan popup!','error');
}

async function loadAll(){
  showLoading(true);
  try{
    const[rl,rr,rc]=await Promise.all([apiGet({action:'getLog'}),apiGet({action:'getRestock'}),apiGet({action:'getLogCabang'})]);
    if(rl.ok) logData=rl.data;
    if(rr.ok) restockData=rr.data;
    if(rc.ok) logCabangData=rc.data;
  }catch(e){showToast('Gagal memuat.','error');}
  showLoading(false);
}
loadAll();
</script>
</body>
</html>
