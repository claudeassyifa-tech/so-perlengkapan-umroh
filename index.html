<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SO Perlengkapan — Assyifa Tour & Travel</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="loading" style="display:none"><div class="spinner"></div><p>Memverifikasi...</p></div>
<div class="login-wrap">
  <div style="width:100%;max-width:380px">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">🧳</div>
        <h1>SO Perlengkapan</h1>
        <p>Assyifa Tour & Travel</p>
      </div>
      <div class="fr">
        <label>Nama Pengguna</label>
        <select id="login-user">
          <option value="">— Pilih akun —</option>
          <option>Admin</option>
          <option>Azhar Dzaky Muhamad HM</option>
          <option>Mang Dedi</option>
        </select>
      </div>
      <div class="fr">
        <label>PIN</label>
        <input type="password" id="login-pin" placeholder="Masukkan PIN" maxlength="6"
               onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <div class="err-msg" id="login-err"></div>
      <button class="btn btn-primary btn-block btn-lg" style="margin-top:14px" onclick="doLogin()">Masuk →</button>
    </div>
    <p style="text-align:center;font-size:11px;color:var(--tx3);margin-top:1.25rem">© 2026 Assyifa Tour & Travel</p>
  </div>
</div>
<script src="config.js"></script>
<script>
if(getUser()) window.location.href='dashboard.html';
async function doLogin(){
  const user=document.getElementById('login-user').value;
  const pin=document.getElementById('login-pin').value;
  const err=document.getElementById('login-err');
  err.style.display='none';
  if(!user){err.style.display='block';err.textContent='Pilih nama pengguna dulu.';return;}
  if(!pin){err.style.display='block';err.textContent='Masukkan PIN.';return;}
  showLoading(true);
  try{
    const res=await apiGet({action:'login',user,pin});
    if(!res.ok){err.style.display='block';err.textContent='PIN salah. Coba lagi.';showLoading(false);return;}
    setUser({username:res.username,role:res.role});
    window.location.href='dashboard.html';
  }catch(e){err.style.display='block';err.textContent='Gagal terhubung.';showLoading(false);}
}
</script>
</body>
</html>
