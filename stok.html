<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stok Gudang — SO Perlengkapan</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="loading" style="display:none"><div class="spinner"></div><p>Memuat stok...</p></div>
<nav class="navbar" id="navbar"></nav>
<div class="container">
  <div class="metrics" id="metrics"></div>
  <div class="toolbar">
    <input type="text" placeholder="🔍 Cari nama barang..." oninput="filterSO(this.value)" style="flex:1"/>
    <button class="btn btn-sm btn-outline" onclick="cetakPDF()">🖨️ Cetak PDF</button>
    <button class="btn btn-sm btn-outline" id="btn-update" onclick="openModal()" style="display:none">✏️ Update</button>
  </div>
  <div class="card" id="so-list"><div class="empty"><div class="empty-icon">📦</div>Memuat...</div></div>
</div>

<!-- Modal Update Stok -->
<div class="modal-overlay" id="modal-stok">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>✏️ Update Stok & Limit</h3>
    <div style="display:grid;grid-template-columns:1fr 70px 70px;gap:4px;padding-bottom:8px;border-bottom:0.5px solid var(--border);margin-bottom:4px">
      <span style="font-size:10px;color:var(--tx2);font-weight:700;text-transform:uppercase">Barang</span>
      <span style="font-size:10px;color:var(--tx2);text-align:center;font-weight:700;text-transform:uppercase">Stok</span>
      <span style="font-size:10px;color:var(--tx2);text-align:center;font-weight:700;text-transform:uppercase">Limit</span>
    </div>
    <div id="stok-edit-body"></div>
    <div class="modal-actions">
      <button class="btn" style="flex:1" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveStok()">💾 Simpan</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
if(!requireLogin()) throw '';
renderNavbar('stok.html');
const user=getUser();
if(user.role==='admin') document.getElementById('btn-update').style.display='';
let stokData=[], soFilter='';

function badge(b){
  if(b.stok==0) return`<span class="badge b-danger">Habis</span>`;
  if(b.stok<=b.limit) return`<span class="badge b-warn">Restock!</span>`;
  return`<span class="badge b-ok">Aman</span>`;
}
function renderMetrics(){
  const aman=stokData.filter(b=>b.stok>b.limit).length;
  const rst=stokData.filter(b=>b.stok>0&&b.stok<=b.limit).length;
  const habis=stokData.filter(b=>b.stok==0).length;
  document.getElementById('metrics').innerHTML=[
    {lbl:'Total Item',val:stokData.length,sub:'jenis',bl:'var(--green)',c:'var(--green)'},
    {lbl:'Stok Aman',val:aman,sub:'item',bl:'var(--green)',c:'var(--green)'},
    {lbl:'Perlu Restock',val:rst,sub:'item',bl:'#EF9F27',c:'#854f0b'},
    {lbl:'Habis',val:habis,sub:'item',bl:'#E24B4A',c:'#a32d2d'},
  ].map(m=>`<div class="metric" style="border-left-color:${m.bl}">
    <div class="lbl">${m.lbl}</div><div class="val" style="color:${m.c}">${m.val}</div><div class="sub">${m.sub}</div>
  </div>`).join('');
}
function renderSO(q=''){
  const list=stokData.filter(b=>(b.nama||'').toLowerCase().includes(q.toLowerCase()));
  if(!list.length){document.getElementById('so-list').innerHTML='<div class="empty"><div class="empty-icon">🔍</div>Tidak ditemukan.</div>';return;}
  document.getElementById('so-list').innerHTML=list.map((b,i)=>{
    const pct=Math.min(100,Math.round(b.stok/Math.max(b.limit*2,20)*100));
    const col=b.stok==0?'#E24B4A':b.stok<=b.limit?'#EF9F27':'#1B6B45';
    return`<div class="so-row">
      <span class="so-no">${stokData.indexOf(b)+1}</span>
      <div class="so-info">
        <div class="so-name">${b.nama}</div>
        <div class="pw"><div class="pb" style="width:${pct}%;background:${col}"></div></div>
      </div>
      <div class="so-right">
        <div class="so-stok" style="color:${col}">${b.stok}</div>
        ${badge(b)}
        <span style="font-size:10px;color:var(--tx3)">limit: ${b.limit}</span>
      </div>
    </div>`;
  }).join('');
}
function filterSO(q){soFilter=q;renderSO(q);}
function openModal(){
  document.getElementById('stok-edit-body').innerHTML=stokData.map((b,i)=>`
    <div class="stok-edit-row">
      <span class="stok-edit-name">${b.nama}</span>
      <input class="stok-inp" type="number" min="0" id="se-s-${i}" value="${b.stok}"/>
      <input class="stok-inp" type="number" min="0" id="se-l-${i}" value="${b.limit}"/>
    </div>`).join('');
  document.getElementById('modal-stok').classList.add('open');
}
function closeModal(){document.getElementById('modal-stok').classList.remove('open');}
async function saveStok(){
  const updates=stokData.map((b,i)=>({nama:b.nama,stok:parseInt(document.getElementById(`se-s-${i}`).value)||0,limit:parseInt(document.getElementById(`se-l-${i}`).value)||0}));
  showLoading(true);
  try{
    const res=await apiPost({action:'updateStok',data:updates});
    if(res.ok){stokData.forEach((b,i)=>{b.stok=updates[i].stok;b.limit=updates[i].limit;});renderSO(soFilter);renderMetrics();closeModal();showToast('Stok diupdate! ✅','success');}
    else showToast(res.msg||'Gagal.','error');
  }catch(e){showToast('Gagal terhubung.','error');}
  showLoading(false);
}
function cetakPDF(){
  if(!stokData.length){showToast('Data belum dimuat.','error');return;}
  const tgl=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const aman=stokData.filter(b=>b.stok>b.limit).length,rst=stokData.filter(b=>b.stok>0&&b.stok<=b.limit).length,habis=stokData.filter(b=>b.stok==0).length;
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Stok Opname</title>
<style>body{font-family:Arial,sans-serif;font-size:12px;margin:0}.page{padding:28px 36px;max-width:720px;margin:0 auto}
.hdr{background:#1B6B45;color:#fff;padding:16px 20px;border-radius:8px;margin-bottom:16px}
.hdr h1{font-size:17px;font-weight:700;margin:0 0 4px}.hdr p{font-size:11px;opacity:.85;margin:2px 0}
.sum{display:flex;gap:10px;margin-bottom:16px}
.sb{flex:1;border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center}
.sb .v{font-size:20px;font-weight:700;color:#1B6B45}.sb .l{font-size:10px;color:#888;text-transform:uppercase}
.sb.w .v{color:#854f0b}.sb.r .v{color:#a32d2d}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#EAF5EE;color:#1B6B45;padding:7px 9px;text-align:left;font-weight:700;border:1px solid #A8D5B8}
td{padding:7px 9px;border:1px solid #ddd}tr:nth-child(even) td{background:#fafafa}
.ok{background:#EAF5EE;color:#1B6B45;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;display:inline-block}
.wa{background:#FEF3E2;color:#854f0b;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;display:inline-block}
.ha{background:#FDECEA;color:#a32d2d;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;display:inline-block}
.foot{margin-top:20px;font-size:10px;color:#aaa;border-top:1px solid #ddd;padding-top:8px;display:flex;justify-content:space-between}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="page">
<div class="hdr"><h1>📦 Laporan Stok Opname Gudang</h1><p>Assyifa Tour & Travel — SO Perlengkapan Umroh</p><p>Dicetak: ${tgl} · Oleh: ${user.username}</p></div>
<div class="sum">
  <div class="sb"><div class="v">${stokData.length}</div><div class="l">Total Item</div></div>
  <div class="sb"><div class="v">${aman}</div><div class="l">Stok Aman</div></div>
  <div class="sb w"><div class="v">${rst}</div><div class="l">Perlu Restock</div></div>
  <div class="sb r"><div class="v">${habis}</div><div class="l">Habis</div></div>
</div>
<table><thead><tr><th>No</th><th>Nama Barang</th><th>Stok</th><th>Limit</th><th>Status</th></tr></thead>
<tbody>${stokData.map((b,i)=>{
  const sc=b.stok==0?'#a32d2d':b.stok<=b.limit?'#854f0b':'#1B6B45';
  const badge=b.stok==0?`<span class="ha">Habis</span>`:b.stok<=b.limit?`<span class="wa">Restock!</span>`:`<span class="ok">Aman</span>`;
  return`<tr><td>${i+1}</td><td><b>${b.nama}</b></td><td style="font-size:14px;font-weight:700;color:${sc}">${b.stok}</td><td style="color:#888">${b.limit}</td><td>${badge}</td></tr>`;
}).join('')}</tbody></table>
<div class="foot"><span>SO Perlengkapan Umroh · Assyifa Tour & Travel</span><span>${tgl}</span></div>
</div></body></html>`;
  const w=window.open('','_blank','width=780,height=650');
  if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);}
  else showToast('Izinkan popup!','error');
}
async function loadStok(){
  showLoading(true);
  try{const res=await apiGet({action:'getStok'});if(res.ok){stokData=res.data;renderMetrics();renderSO();}}
  catch(e){showToast('Gagal terhubung.','error');}
  showLoading(false);
}
loadStok();
</script>
</body>
</html>
