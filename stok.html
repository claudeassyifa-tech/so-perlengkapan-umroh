<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stok Opname — SO Perlengkapan</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="loading" style="display:none"><div class="spinner"></div><p>Memuat stok...</p></div>
<nav class="navbar" id="navbar"></nav>

<div class="container">
  <div class="metrics" id="metrics-bar"></div>
  <div class="toolbar">
    <input type="text" placeholder="🔍 Cari nama barang..." oninput="filterSO(this.value)"/>
    <button class="btn btn-sm btn-outline" onclick="cetakPDFStok()">
      <i class="ti ti-printer" aria-hidden="true"></i> Cetak PDF
    </button>
    <button class="btn btn-sm btn-outline" id="btn-update" onclick="openModal()" style="display:none">
      <i class="ti ti-pencil" aria-hidden="true"></i> Update
    </button>
  </div>
  <div class="card" id="so-list"><div class="empty"><div class="empty-icon">📦</div>Memuat data stok...</div></div>
  <p style="font-size:11px;color:var(--tx3);text-align:center;margin-top:-8px">
    <i class="ti ti-info-circle" aria-hidden="true"></i> Harga adalah pricelist referensi saja.
  </p>
</div>

<!-- Modal Update Stok -->
<div class="modal-overlay" id="modal-stok">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3><i class="ti ti-pencil" aria-hidden="true"></i> Update Stok, Harga & Limit</h3>
    <div style="display:grid;grid-template-columns:1fr 68px 68px 60px;gap:4px;padding-bottom:8px;border-bottom:0.5px solid var(--border);margin-bottom:4px">
      <span style="font-size:10px;color:var(--tx2);font-weight:700;text-transform:uppercase">Barang</span>
      <span style="font-size:10px;color:var(--tx2);text-align:center;font-weight:700;text-transform:uppercase">Harga</span>
      <span style="font-size:10px;color:var(--tx2);text-align:center;font-weight:700;text-transform:uppercase">Stok</span>
      <span style="font-size:10px;color:var(--tx2);text-align:center;font-weight:700;text-transform:uppercase">Limit</span>
    </div>
    <div id="stok-edit-body"></div>
    <div class="modal-actions">
      <button class="btn" style="flex:1" onclick="closeModal('modal-stok')">Batal</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveStok()">
        <i class="ti ti-device-floppy" aria-hidden="true"></i> Simpan
      </button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
if(!requireLogin()) throw new Error('not logged in');
renderNavbar('stok.html');
const user=getUser();
if(user.role==='admin') document.getElementById('btn-update').style.display='';

let stokData=[],soFilter='';

function stokBadge(b){
  if(b.stok==0) return`<span class="badge b-danger">Habis</span>`;
  if(b.stok<=b.limit) return`<span class="badge b-warn">Restock!</span>`;
  return`<span class="badge b-ok">Aman</span>`;
}
function renderMetrics(){
  const aman=stokData.filter(b=>b.stok>b.limit).length;
  const rst=stokData.filter(b=>b.stok>0&&b.stok<=b.limit).length;
  const habis=stokData.filter(b=>b.stok==0).length;
  document.getElementById('metrics-bar').innerHTML=[
    {lbl:'Total Item',val:stokData.length,sub:'jenis barang'},
    {lbl:'Stok Aman',val:aman,sub:'item'},
    {lbl:'Perlu Restock',val:rst,sub:'item',top:'#EF9F27',color:'#854f0b'},
    {lbl:'Habis',val:habis,sub:'item',top:'#ccc',color:'#888'},
  ].map(m=>`<div class="metric" style="border-top-color:${m.top||'var(--green)'}">
    <div class="lbl">${m.lbl}</div>
    <div class="val" style="color:${m.color||'var(--green)'}">${m.val}</div>
    <div class="sub">${m.sub}</div>
  </div>`).join('');
}
function renderSO(q=''){
  const list=stokData.filter(b=>b.nama.toLowerCase().includes(q.toLowerCase()));
  if(!list.length){document.getElementById('so-list').innerHTML='<div class="empty"><div class="empty-icon">🔍</div>Barang tidak ditemukan.</div>';return;}
  document.getElementById('so-list').innerHTML=list.map(b=>{
    const pct=Math.min(100,Math.round(b.stok/Math.max(b.limit*2,20)*100));
    const col=b.stok<=b.limit?'#E24B4A':'#1D9E75';
    return`<div class="so-row">
      <span class="so-no">${stokData.indexOf(b)+1}</span>
      <div class="so-info">
        <div class="so-name">${b.nama}</div>
        <div class="so-price">${rp(b.harga)}</div>
        <div class="pw"><div class="pb" style="width:${pct}%;background:${col}"></div></div>
      </div>
      <div class="so-right">
        <div class="so-stok">${b.stok}</div>
        ${stokBadge(b)}
        <span style="font-size:10px;color:var(--tx3)">limit: ${b.limit}</span>
      </div>
    </div>`;
  }).join('');
}
function filterSO(q){soFilter=q;renderSO(q);}

function openModal(){
  document.getElementById('stok-edit-body').innerHTML=stokData.map((b,i)=>`
    <div class="stok-edit-row">
      <span class="stok-edit-name">${b.nama}</span>
      <input class="stok-inp" type="number" min="0" id="se-h-${i}" value="${b.harga}" style="width:74px"/>
      <input class="stok-inp" type="number" min="0" id="se-s-${i}" value="${b.stok}"/>
      <input class="stok-inp" type="number" min="0" id="se-l-${i}" value="${b.limit}"/>
    </div>`).join('');
  document.getElementById('modal-stok').classList.add('open');
}
function closeModal(id){document.getElementById(id).classList.remove('open');}

async function saveStok(){
  const updates=stokData.map((b,i)=>({
    nama:b.nama,
    harga:parseInt(document.getElementById(`se-h-${i}`).value)||0,
    stok:parseInt(document.getElementById(`se-s-${i}`).value)||0,
    limit:parseInt(document.getElementById(`se-l-${i}`).value)||0,
  }));
  showLoading(true);
  try{
    const res=await apiPost({action:'updateStok',data:updates});
    if(res.ok){stokData.forEach((b,i)=>{b.harga=updates[i].harga;b.stok=updates[i].stok;b.limit=updates[i].limit;});renderSO(soFilter);renderMetrics();closeModal('modal-stok');showToast('Stok berhasil diupdate! ✅','success');}
    else showToast('Gagal menyimpan.','error');
  }catch(e){showToast('Gagal terhubung.','error');}
  showLoading(false);
}

function cetakPDFStok(){
  if(!stokData.length){showToast('Data stok belum dimuat.','error');return;}
  const user=getUser();
  const tglCetak=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const aman=stokData.filter(b=>b.stok>b.limit).length;
  const rst=stokData.filter(b=>b.stok>0&&b.stok<=b.limit).length;
  const habis=stokData.filter(b=>b.stok==0).length;

  const html=`<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<title>Stok Opname — SO Perlengkapan</title>
<style>
  body{font-family:Arial,sans-serif;font-size:12px;color:#111;margin:0}
  .page{padding:28px 36px;max-width:740px;margin:0 auto}
  .header{background:#1B6B45;color:#fff;padding:16px 20px;border-radius:8px;margin-bottom:20px}
  .header h1{font-size:18px;font-weight:700;margin:0 0 4px}
  .header p{font-size:11px;opacity:.85;margin:2px 0}
  .summary{display:flex;gap:12px;margin-bottom:18px}
  .sum-box{flex:1;border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center;border-top:3px solid #1B6B45}
  .sum-box .val{font-size:22px;font-weight:700;color:#1B6B45}
  .sum-box .lbl{font-size:10px;color:#888;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .sum-box.warn{border-top-color:#EF9F27}.sum-box.warn .val{color:#854f0b}
  .sum-box.danger{border-top-color:#E24B4A}.sum-box.danger .val{color:#a32d2d}
  .sum-box.ok{border-top-color:#3b6d11}.sum-box.ok .val{color:#3b6d11}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:#EAF5EE;color:#1B6B45;text-align:left;padding:8px 10px;font-weight:700;border:1px solid #A8D5B8}
  td{padding:7px 10px;border:1px solid #ddd;vertical-align:middle}
  tr:nth-child(even) td{background:#fafafa}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:700}
  .b-ok{background:#eaf3de;color:#3b6d11}
  .b-warn{background:#faeeda;color:#854f0b}
  .b-danger{background:#fcebeb;color:#a32d2d}
  .bar-wrap{background:#eee;border-radius:99px;height:5px;width:80px;display:inline-block;vertical-align:middle}
  .bar{height:5px;border-radius:99px}
  .footer{margin-top:24px;font-size:10px;color:#aaa;border-top:1px solid #ddd;padding-top:10px;display:flex;justify-content:space-between}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.page{padding:20px 28px}}
</style></head><body><div class="page">

<div class="header">
  <h1>📦 Laporan Stok Opname Gudang</h1>
  <p>Assyifa Tour & Travel — SO Perlengkapan Umroh</p>
  <p>Dicetak: ${tglCetak} &nbsp;·&nbsp; Oleh: ${user.username}</p>
</div>

<div class="summary">
  <div class="sum-box"><div class="val">${stokData.length}</div><div class="lbl">Total Item</div></div>
  <div class="sum-box ok"><div class="val">${aman}</div><div class="lbl">Stok Aman</div></div>
  <div class="sum-box warn"><div class="val">${rst}</div><div class="lbl">Perlu Restock</div></div>
  <div class="sum-box danger"><div class="val">${habis}</div><div class="lbl">Habis</div></div>
</div>

<table>
  <thead>
    <tr>
      <th width="4%">No</th>
      <th width="35%">Nama Barang</th>
      <th width="18%">Harga (Pricelist)</th>
      <th width="10%">Stok</th>
      <th width="10%">Limit</th>
      <th width="13%">Status</th>
      <th width="10%">Grafik</th>
    </tr>
  </thead>
  <tbody>
    ${stokData.map((b,i)=>{
      const pct=Math.min(100,Math.round(b.stok/Math.max(b.limit*2,20)*100));
      const col=b.stok==0?'#E24B4A':b.stok<=b.limit?'#EF9F27':'#3b6d11';
      const badge=b.stok==0?'<span class="badge b-danger">Habis</span>':b.stok<=b.limit?'<span class="badge b-warn">Restock!</span>':'<span class="badge b-ok">Aman</span>';
      return`<tr>
        <td>${i+1}</td>
        <td><strong>${b.nama}</strong></td>
        <td>Rp ${Number(b.harga).toLocaleString('id-ID')}</td>
        <td style="font-size:15px;font-weight:700;color:${col}">${b.stok}</td>
        <td style="color:#888">${b.limit}</td>
        <td>${badge}</td>
        <td><div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${col}"></div></div></td>
      </tr>`;
    }).join('')}
  </tbody>
</table>

<div class="footer">
  <span>SO Perlengkapan Umroh · Assyifa Tour & Travel</span>
  <span>${tglCetak}</span>
</div>
</div></body></html>`;

  const w=window.open('','_blank','width=820,height=680');
  if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),700);}
  else showToast('Izinkan popup di browser untuk mencetak!','error');
}

async function loadStok(){
  showLoading(true);
  try{const res=await apiGet({action:'getStok'});if(res.ok){stokData=res.data;renderMetrics();renderSO();}else showToast('Gagal memuat.','error');}
  catch(e){showToast('Gagal terhubung.','error');}
  showLoading(false);
}
loadStok();
</script>
</body>
</html>
