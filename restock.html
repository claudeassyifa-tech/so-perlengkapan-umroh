<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Restock — SO Perlengkapan</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="loading" style="display:none"><div class="spinner"></div><p>Menyimpan restock...</p></div>
<nav class="navbar" id="navbar"></nav>

<div class="container">

  <!-- Form Restock -->
  <div class="card">
    <div class="card-title"><i class="ti ti-package-import" aria-hidden="true"></i> Catat Barang Masuk</div>
    <div class="fr">
      <label>Keterangan Restock (opsional)</label>
      <input type="text" id="rs-ket" placeholder="cth: Pembelian batch Juni 2026"/>
    </div>
    <div style="display:grid;grid-template-columns:1fr 58px 58px;gap:6px;padding-bottom:8px;border-bottom:0.5px solid var(--border);margin-bottom:8px">
      <span style="font-size:10px;color:var(--tx2);font-weight:700;text-transform:uppercase">Nama Barang</span>
      <span style="font-size:10px;color:var(--tx2);text-align:center;font-weight:700;text-transform:uppercase">Stok</span>
      <span style="font-size:10px;color:var(--tx2);text-align:center;font-weight:700;text-transform:uppercase">+ Masuk</span>
    </div>
    <div id="restock-list"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:1rem;padding-top:.875rem;border-top:0.5px solid var(--border)">
      <button class="btn btn-outline btn-sm" onclick="resetRestock()">
        <i class="ti ti-refresh" aria-hidden="true"></i> Reset
      </button>
      <button class="btn btn-primary" onclick="simpanRestock()">
        <i class="ti ti-device-floppy" aria-hidden="true"></i> Simpan Restock
      </button>
    </div>
  </div>

  <!-- History Restock -->
  <div class="section-label">Riwayat Barang Masuk</div>
  <div class="card" id="restock-history">
    <div class="empty"><div class="empty-icon">📥</div>Memuat riwayat...</div>
  </div>
</div>

<script src="config.js"></script>
<script>
if(!requireLogin()) throw new Error('not logged in');
renderNavbar('restock.html');
const user=getUser();
let stokData=[], rsHistory=[];

function renderRestockList(){
  document.getElementById('restock-list').innerHTML=stokData.map((b,i)=>`
    <div class="restock-row">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:500">${b.nama}</div>
        <div style="font-size:11px;color:var(--tx2)">${rp(b.harga)}</div>
      </div>
      <div style="min-width:50px;text-align:center">
        <span style="font-size:14px;font-weight:600;color:${b.stok<=b.limit?'#E24B4A':'var(--tx)'}">${b.stok}</span>
        ${b.stok<=b.limit?`<div style="font-size:9px;color:#854f0b;font-weight:600">RESTOCK!</div>`:''}
      </div>
      <input class="restock-inp" type="number" min="0" value="0" id="rs-${i}" placeholder="0"/>
    </div>`).join('');
}

function resetRestock(){
  stokData.forEach((_,i)=>{const el=document.getElementById(`rs-${i}`);if(el)el.value=0;});
  document.getElementById('rs-ket').value='';
}

async function simpanRestock(){
  const ket=document.getElementById('rs-ket').value.trim();
  const items=stokData
    .map((b,i)=>({nama:b.nama,jumlah:parseInt(document.getElementById(`rs-${i}`).value)||0,tanggal:isoToday(),petugas:user.username,keterangan:ket}))
    .filter(x=>x.jumlah>0);
  if(!items.length){showToast('Masukkan jumlah restock minimal 1 barang!','error');return;}
  showLoading(true);
  try{
    const res=await apiPost({action:'simpanRestock',data:{items}});
    if(res.ok){
      showToast(`✅ Restock ${items.length} item berhasil disimpan!`,'success');
      items.forEach(item=>{const b=stokData.find(x=>x.nama===item.nama);if(b)b.stok+=item.jumlah;});
      resetRestock();renderRestockList();
      await loadHistory();
    } else showToast(res.msg||'Gagal menyimpan.','error');
  }catch(e){showToast('Gagal terhubung.','error');}
  showLoading(false);
}

function renderHistory(){
  if(!rsHistory.length){document.getElementById('restock-history').innerHTML='<div class="empty"><div class="empty-icon">📭</div>Belum ada riwayat restock.</div>';return;}
  const grouped={};
  rsHistory.forEach(r=>{
    const key=`${r.tanggal}|||${r.petugas}|||${r.keterangan}`;
    if(!grouped[key])grouped[key]={tanggal:r.tanggal,petugas:r.petugas,keterangan:r.keterangan,items:[]};
    grouped[key].items.push({nama:r.nama_barang,jumlah:r.jumlah});
  });
  document.getElementById('restock-history').innerHTML=Object.values(grouped).map(g=>{
    const d=new Date(g.tanggal);
    return`<div class="log-row">
      <div class="log-date"><div class="log-d">${isNaN(d)?'—':d.getDate()}</div><div class="log-m">${isNaN(d)?'—':BLN[d.getMonth()]}</div></div>
      <div class="log-info">
        <div class="log-n">Barang Masuk <span class="badge b-green" style="margin-left:4px">${g.items.length} item</span></div>
        <div class="log-s"><i class="ti ti-user-check" aria-hidden="true" style="font-size:11px"></i> ${g.petugas}${g.keterangan?` · ${g.keterangan}`:''}</div>
        <div class="log-pills">${g.items.map(it=>`<span class="pill">+${it.jumlah} ${it.nama}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

async function loadHistory(){
  try{const res=await apiGet({action:'getRestock'});if(res.ok){rsHistory=res.data;renderHistory();}}
  catch(e){}
}

async function init(){
  showLoading(true);
  try{
    const [rs,rh]=await Promise.all([apiGet({action:'getStok'}),apiGet({action:'getRestock'})]);
    if(rs.ok){stokData=rs.data;renderRestockList();}
    if(rh.ok){rsHistory=rh.data;renderHistory();}
  }catch(e){showToast('Gagal memuat data.','error');}
  showLoading(false);
}
init();
</script>
</body>
</html>
