<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard — SO Perlengkapan</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="loading" style="display:none"><div class="spinner"></div><p>Memuat...</p></div>
<nav class="navbar" id="navbar"></nav>
<div class="container">
  <div style="margin-bottom:16px">
    <div style="font-size:18px;font-weight:800" id="welcome">Selamat datang! 👋</div>
    <div style="font-size:13px;color:var(--tx2);margin-top:3px" id="welcome-sub"></div>
  </div>
  <div class="metrics" id="metrics"></div>
  <div class="alert-restock" id="alert-restock">
    <span style="font-size:17px;flex-shrink:0">⚠️</span>
    <div><strong>Perlu Restock:</strong> <span id="alert-list"></span></div>
  </div>
  <div class="section-label">Menu Utama</div>
  <div class="nav-grid">
    <a href="stok.html" class="nav-card"><span class="nc-icon">📦</span><div class="nc-label">Stok Gudang</div><div class="nc-sub">Lihat & update stok</div></a>
    <a href="keluar.html" class="nav-card"><span class="nc-icon">📤</span><div class="nc-label">Barang Keluar</div><div class="nc-sub">Catat pengeluaran barang</div></a>
    <a href="masuk.html" class="nav-card"><span class="nc-icon">📥</span><div class="nc-label">Barang Masuk</div><div class="nc-sub">Restock dari supplier</div></a>
    <a href="cabang.html" class="nav-card"><span class="nc-icon">🏪</span><div class="nc-label">Gudang Cabang</div><div class="nc-sub">Stok di agen & mitra</div></a>
    <a href="history.html" class="nav-card"><span class="nc-icon">📋</span><div class="nc-label">History</div><div class="nc-sub">Riwayat semua transaksi</div></a>
    <a href="laporan.html" class="nav-card"><span class="nc-icon">📄</span><div class="nc-label">Laporan PDF</div><div class="nc-sub">Cetak laporan periode</div></a>
  </div>
</div>
<script src="config.js"></script>
<script>
if(!requireLogin()) throw '';
renderNavbar('dashboard.html');
const user = getUser();
document.getElementById('welcome-sub').textContent = `Halo, ${user.username.split(' ')[0]}! Berikut ringkasan stok hari ini.`;

async function load(){
  showLoading(true);
  try{
    const res = await apiGet({action:'getStok'});
    if(res.ok){
      const d=res.data;
      const aman=d.filter(b=>b.stok>b.limit).length;
      const rst=d.filter(b=>b.stok>0&&b.stok<=b.limit).length;
      const habis=d.filter(b=>b.stok==0).length;
      document.getElementById('metrics').innerHTML=[
        {lbl:'Total Item',val:d.length,sub:'jenis barang',c:'var(--green)',bl:'var(--green)'},
        {lbl:'Stok Aman',val:aman,sub:'item',c:'var(--green)',bl:'var(--green)'},
        {lbl:'Perlu Restock',val:rst,sub:'item',c:'#854f0b',bl:'#EF9F27'},
        {lbl:'Habis',val:habis,sub:'item',c:'#a32d2d',bl:'#E24B4A'},
      ].map(m=>`<div class="metric" style="border-left-color:${m.bl}">
        <div class="lbl">${m.lbl}</div><div class="val" style="color:${m.c}">${m.val}</div><div class="sub">${m.sub}</div>
      </div>`).join('');
      const ri=d.filter(b=>b.stok<=b.limit);
      if(ri.length){
        document.getElementById('alert-restock').classList.add('show');
        document.getElementById('alert-list').textContent=ri.map(b=>`${b.nama} (sisa ${b.stok})`).join(', ');
      }
    }
  }catch(e){showToast('Gagal memuat data','error');}
  showLoading(false);
}
load();
</script>
</body>
</html>
