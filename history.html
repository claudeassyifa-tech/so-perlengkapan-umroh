<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>History — SO Perlengkapan</title>
<link rel="stylesheet" href="style.css"/>
<style>
.log-meta-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.items-box{background:var(--bg2);border-radius:8px;padding:8px 10px;border:0.5px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:2px}
.item-chip{font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:4px;padding:2px 0}
.item-dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
.qty{font-weight:700;color:var(--tx);font-size:12px;min-width:20px}
.total-chip{display:inline-flex;align-items:center;gap:4px;background:var(--green-soft);color:var(--green);font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;margin-top:7px}
</style>
</head>
<body>
<div id="loading" style="display:none"><div class="spinner"></div><p>Memuat...</p></div>
<nav class="navbar" id="navbar"></nav>
<div class="container">
  <div class="toolbar">
    <input type="text" placeholder="🔍 Cari keterangan..." oninput="filterLog(this.value)" style="flex:1"/>
    <select id="filt-tipe" onchange="filterLog(document.querySelector('.toolbar input').value)" style="min-width:110px">
      <option value="">Semua Tipe</option>
      <option value="keluar">Barang Keluar</option>
      <option value="masuk">Barang Masuk</option>
      <option value="kirim">Kirim ke Cabang</option>
      <option value="kembali">Kembali dari Cabang</option>
    </select>
    <select id="filt-pet" onchange="filterLog(document.querySelector('.toolbar input').value)" style="min-width:100px">
      <option value="">Semua Petugas</option>
      <option>Admin</option>
      <option>Azhar Dzaky Muhamad HM</option>
      <option>Mang Dedi</option>
    </select>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div id="summary" style="font-size:13px;color:var(--tx2)"></div>
    <button class="btn btn-outline btn-sm" onclick="cetakPDF()">🖨️ Cetak PDF</button>
  </div>
  <div class="card" id="log-list"><div class="empty"><div class="empty-icon">📋</div>Memuat riwayat...</div></div>
</div>
<script src="config.js"></script>
<script>
if(!requireLogin()) throw '';
renderNavbar('history.html');
const user=getUser();
let allData=[], filtered=[];

function itemsToQty(items){ const m={}; (items||[]).forEach(x=>{m[x.nama]=(m[x.nama]||0)+Number(x.jumlah);}); return m; }

function renderItemsBox(items){
  const map=itemsToQty(items);
  return`<div class="items-box">${Object.entries(map).map(([n,q])=>`
    <div class="item-chip"><span class="item-dot"></span><span class="qty">×${q}</span> ${n}</div>`).join('')}</div>`;
}

function tipeBadge(tipe){
  const m={'keluar':'<span class="badge b-danger" style="margin-left:4px">📤 Keluar</span>',
    'masuk':'<span class="badge b-green" style="margin-left:4px">📥 Masuk</span>',
    'kirim':'<span class="badge b-warn" style="margin-left:4px">🏪 Ke Cabang</span>',
    'kembali':'<span class="badge b-blue" style="margin-left:4px">🔄 Dari Cabang</span>'};
  return m[tipe]||`<span class="badge b-info" style="margin-left:4px">${tipe}</span>`;
}

function renderLog(){
  if(!filtered.length){document.getElementById('log-list').innerHTML='<div class="empty"><div class="empty-icon">📭</div>Belum ada riwayat.</div>';return;}
  document.getElementById('log-list').innerHTML=filtered.map(l=>{
    const d=new Date(l.tanggal||'');
    const day=isNaN(d)?'—':d.getDate(), mon=isNaN(d)?'—':BLN[d.getMonth()];
    const items=l.items||[];
    const total=items.reduce((s,x)=>s+Number(x.jumlah),0);

    // Nama display sesuai tipe
    let namaDisplay='';
    if(l.tipe==='keluar') namaDisplay=l.keterangan||'Barang Keluar';
    else if(l.tipe==='masuk') namaDisplay=l.keterangan||'Barang Masuk';
    else if(l.tipe==='kirim') namaDisplay=`→ ${l.nama_cabang||''}${l.keterangan?' · '+l.keterangan:''}`;
    else if(l.tipe==='kembali') namaDisplay=`← ${l.nama_cabang||''}${l.keterangan?' · '+l.keterangan:''}`;
    else namaDisplay=l.keterangan||'—';

    return`<div class="log-row">
      <div class="log-date"><div class="log-d">${day}</div><div class="log-m">${mon}</div></div>
      <div class="log-info">
        <div class="log-n" style="font-size:13px;font-weight:700">${namaDisplay}${tipeBadge(l.tipe)}</div>
        <div class="log-meta-row" style="margin-top:4px;margin-bottom:6px">
          <span style="font-size:11px;color:var(--tx2)">${fmtDateLong(l.tanggal)}</span>
          <span style="color:var(--border2)">·</span>
          ${petugasChip(l.petugas)}
        </div>
        ${items.length?renderItemsBox(items):''}
        ${total?`<div class="total-chip">📦 ${total} pcs</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function filterLog(q){
  const tipe=document.getElementById('filt-tipe').value;
  const pet=document.getElementById('filt-pet').value;
  filtered=allData.filter(l=>{
    const ket=(l.keterangan||l.nama_cabang||'').toLowerCase();
    return ket.includes(q.toLowerCase())&&(!tipe||l.tipe===tipe)&&(!pet||l.petugas===pet);
  });
  document.getElementById('summary').textContent=filtered.length?`Menampilkan ${filtered.length} transaksi`:'';
  renderLog();
}

function cetakPDF(){
  if(!filtered.length){showToast('Tidak ada data.','error');return;}
  const tgl=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>History Log</title>
<style>body{font-family:Arial,sans-serif;font-size:12px;margin:0}.page{padding:28px 36px;max-width:740px;margin:0 auto}
.hdr{background:#1B6B45;color:#fff;padding:16px 20px;border-radius:8px;margin-bottom:16px}
.hdr h1{font-size:17px;font-weight:700;margin:0 0 4px}.hdr p{font-size:11px;opacity:.85;margin:2px 0}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:#EAF5EE;color:#1B6B45;padding:7px 9px;text-align:left;font-weight:700;border:1px solid #A8D5B8}
td{padding:7px 9px;border:1px solid #ddd;vertical-align:top}tr:nth-child(even) td{background:#fafafa}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:600}
.keluar{background:#FDECEA;color:#a32d2d}.masuk{background:#EAF5EE;color:#1B6B45}
.kirim{background:#FEF3E2;color:#854f0b}.kembali{background:#E8F1FB;color:#185FA5}
.foot{margin-top:20px;font-size:10px;color:#aaa;border-top:1px solid #ddd;padding-top:8px;display:flex;justify-content:space-between}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="page">
<div class="hdr"><h1>📋 History Log Transaksi</h1><p>Assyifa Tour & Travel — SO Perlengkapan Umroh</p><p>Dicetak: ${tgl} · Oleh: ${user.username} · ${filtered.length} transaksi</p></div>
<table><thead><tr><th>No</th><th>Tanggal</th><th>Keterangan</th><th>Tipe</th><th>Barang</th><th>Petugas</th></tr></thead>
<tbody>${filtered.map((l,i)=>{
  const items=l.items||[];
  const map=itemsToQty(items);
  const barangStr=Object.entries(map).map(([n,q])=>`${n} ×${q}`).join(', ');
  const tipeLabel={'keluar':'Keluar','masuk':'Masuk','kirim':'Ke Cabang','kembali':'Dari Cabang'};
  return`<tr><td>${i+1}</td><td>${fmtDateLong(l.tanggal)}</td>
    <td>${l.keterangan||l.nama_cabang||'—'}</td>
    <td><span class="badge ${l.tipe||''}">${tipeLabel[l.tipe]||l.tipe}</span></td>
    <td>${barangStr}</td><td>${l.petugas||''}</td></tr>`;
}).join('')}</tbody></table>
<div class="foot"><span>SO Perlengkapan Umroh · Assyifa Tour & Travel</span><span>${tgl}</span></div>
</div></body></html>`;
  const w=window.open('','_blank','width=820,height=680');
  if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);}
  else showToast('Izinkan popup!','error');
}

async function loadAll(){
  showLoading(true);
  try{
    const [rl, rcbg, rrs] = await Promise.all([
      apiGet({action:'getLog'}),
      apiGet({action:'getLogCabang'}),
      apiGet({action:'getRestock'}),
    ]);

    // Normalisasi tanggal ke YYYY-MM-DD
    function normTgl(val){
      if(!val) return '';
      const s=String(val).trim();
      if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const d=new Date(s);
      if(!isNaN(d)){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${dd}`;}
      return s;
    }

    // Parse items dari berbagai format
    function parseItems(l){
      // Sudah ada l.items dari backend
      if(Array.isArray(l.items)&&l.items.length) return l.items;
      // Coba parse dari l.detail (format baru)
      if(l.detail){try{const p=JSON.parse(l.detail);if(Array.isArray(p))return p;}catch{}}
      // Coba parse dari l.barang (format JSON string)
      if(l.barang&&typeof l.barang==='string'&&l.barang.startsWith('[')){
        try{const p=JSON.parse(l.barang);if(Array.isArray(p))return p;}catch{}
      }
      // Format lama: "Koper×3, Mukena×1" atau "Koper, Mukena"
      if(l.barang&&typeof l.barang==='string'){
        const parts=l.barang.split(',').map(s=>s.trim()).filter(Boolean);
        const map={};
        parts.forEach(p=>{
          const m=p.match(/^(.+)[×x](\d+)$/);
          if(m){map[m[1].trim()]=(map[m[1].trim()]||0)+parseInt(m[2]);}
          else if(p){map[p]=(map[p]||0)+1;}
        });
        return Object.entries(map).map(([nama,jumlah])=>({nama,jumlah}));
      }
      return [];
    }

    const logKeluar=(rl.ok?rl.data:[]).map(l=>({
      ...l,
      tipe: l.tipe||'keluar',
      tanggal: normTgl(l.tanggal),
      items: parseItems(l),
      keterangan: l.keterangan||''
    }));

    const logCabang=(rcbg.ok?rcbg.data:[]).map(l=>({
      ...l,
      tanggal: normTgl(l.tanggal),
      items: parseItems(l),
    }));

    // Group restock
    const rsGroups={};
    (rrs.ok?rrs.data:[]).forEach(r=>{
      const tgl=normTgl(r.tanggal);
      const k=`${tgl}||${r.petugas}||${r.keterangan}`;
      if(!rsGroups[k]) rsGroups[k]={tanggal:tgl,petugas:r.petugas,keterangan:r.keterangan,tipe:'masuk',items:[]};
      rsGroups[k].items.push({nama:r.nama_barang,jumlah:Number(r.jumlah)});
    });
    const logMasuk=Object.values(rsGroups);

    // Gabung & sort terbaru dulu
    allData=[...logKeluar,...logCabang,...logMasuk]
      .sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
    filtered=[...allData];
    document.getElementById('summary').textContent=`Menampilkan ${filtered.length} transaksi`;
    renderLog();
  }catch(e){console.error(e);showToast('Gagal memuat.','error');}
  showLoading(false);
}
loadAll();
</script>
</body>
</html>
